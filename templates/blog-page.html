{% extends "base.html" %}

{% block scripts %}
<!-- CSS -->
<link rel="stylesheet" href="../../font-opensans.css" />
<link rel="stylesheet" href="../../font-fira.css" />
<link rel="stylesheet" href="../../main.css" />

<!-- Syntax Highlighting -->
<link rel="stylesheet" type="text/css" href="/syntax-theme-dark.css" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" type="text/css" href="/syntax-theme-light.css" media="(prefers-color-scheme: light)" />

<!-- Atom Feed -->
<link rel="alternate" type="application/atom+xml" title="Atom"
    href="{{ get_url(path='blog/atom.xml', trailing_slash=false)}}">
{% endblock scripts %}

{% block content %}
<h1 class="title" style="padding-top: 30px; text-align: center;">
    {{ page.title }}
</h1>
<p style="text-align: center;">
    <strong>{{ page.date }}</strong>
    <br />
    🕓 {{ page.reading_time }} min ({{ page.word_count }} words)
</p>
{{ page.content | safe }}
{% endblock content %}
